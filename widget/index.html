<!-- Template for the ui:// resource. scripts/build-widget.mjs swaps the two
     placeholders below for the bundled Anton face and the bundled JS, producing
     one self-contained file with no external requests except the template
     images from api.memegen.link. The placeholder tokens appear exactly once
     each, here in the markup and nowhere in this comment — the build asserts
     that, because a second occurrence would swallow the substitution and ship a
     page whose script never runs. -->
<meta charset="utf-8" />
<title>Meme editor</title>
<style>
  @font-face {
    font-family: "Anton";
    src: url("__FONT__") format("truetype");
    font-display: block;
  }
  :root {
    color-scheme: light dark;
    --fg: #16181d;
    --muted: #6b7280;
    --line: #d8dae0;
    --bg: #ffffff;
    --accent: #2d6cdf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e9eaee;
      --muted: #9aa0ab;
      --line: #33363d;
      --bg: #14161a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #thumbs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .thumb {
    flex: 0 0 auto;
    width: 108px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .thumb.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .thumb canvas {
    width: 96px;
    height: auto;
    max-height: 120px;
    object-fit: contain;
    border-radius: 6px;
    background: #000;
  }
  .thumb span {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.2;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  main {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  #stage {
    flex: 1 1 260px;
    min-width: 220px;
    max-width: 380px;
    height: auto;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #000;
  }
  #panel { flex: 1 1 260px; min-width: 240px; display: flex; flex-direction: column; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field span { font-size: 12px; color: var(--muted); }
  .field input {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .slider { gap: 6px; }
  .slider .row { display: flex; align-items: center; gap: 10px; }
  .slider input[type="range"] {
    flex: 1 1 auto;
    accent-color: var(--accent);
    padding: 0;
    border: 0;
    background: transparent;
  }
  .slider output {
    flex: 0 0 auto;
    min-width: 3.2em;
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #copy {
    align-self: flex-start;
    padding: 8px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #status { margin: 0; font-size: 12px; color: var(--muted); }
  #status[data-tone="error"] { color: #c0392b; }
</style>

<div id="thumbs"></div>
<main>
  <canvas id="stage" width="600" height="600"></canvas>
  <div id="panel">
    <div id="fields"></div>
    <label class="field slider">
      <span>Text size</span>
      <span class="row">
        <input id="scale" type="range" min="0.6" max="1.6" step="0.05" value="1" />
        <output id="scale-value" for="scale">100%</output>
      </span>
    </label>
    <button id="copy" type="button">Copy image</button>
    <p id="status">Waiting for the editor to open…</p>
  </div>
</main>
<script type="module">
__SCRIPT__
</script>
